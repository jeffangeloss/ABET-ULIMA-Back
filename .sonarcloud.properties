# Análisis automático de SonarQube Cloud (docs/devops.md, sección «SonarQube Cloud, Snyk y secretos»).
#
# El plan gratuito admite repos privados hasta 50 000 líneas por organización y solo analiza la
# rama principal y los PR hacia ella. Por eso, en la consola de SonarQube Cloud, la rama principal
# del proyecto se cambia a develop. Quedan fuera los datos inventados de prueba, las specs, la
# documentación, la configuración de agentes y los scripts de shell, que no se despliegan. Las
# migraciones de db/ se analizan sin buscar duplicados, porque repiten a propósito el molde de las
# anteriores, y las pruebas SQL de db/pruebas/ quedan fuera del conteo de líneas.
#
# Cuando haya pruebas con cobertura, el análisis pasa a la CI (sonar-project.properties, la acción
# oficial fijada por SHA y el secreto SONAR_TOKEN) y se apaga el análisis automático en la consola.
sonar.exclusions=tests/datos_inventados/**,specs/**,.specify/**,.claude/**,docs/**,scripts/**,db/pruebas/**
sonar.cpd.exclusions=db/**/*.sql
