# Pruebas de cada cambio y control del flujo de ramas (docs/devops.md).
# Hoy «pruebas» corre la revisión previa (scripts/preflight.sh), las pruebas de la base
# (db/pruebas/) y pytest, que incluye la lectura del Gherkin en español de specs/ y los exports
# inventados. Los pasos de aceptación (T050) entran en ese mismo pytest, para que el check
# requerido por la protección de ramas siga llamándose igual.
# No usa acciones ni imágenes de Redgate mientras su licencia esté en revisión.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    # PostgreSQL 16 desechable para las pruebas de la base (db/pruebas/), que aplican las
    # migraciones con psql, sin Flyway ni imágenes de Redgate. Vive solo lo que dura el job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prueba de la revisión previa y del hook de memoria (casos que deben pasar y que deben fallar)
        run: bash scripts/probar_preflight.sh
      - name: Revisión previa (datos inventados, secretos y memoria)
        # Los PR de Dependabot no escriben MEMORIA.md; se revisa el repositorio completo y la
        # actualización queda registrada en la memoria con el siguiente cambio (docs/devops.md).
        env:
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          AUTOR: ${{ github.actor }}
        run: |
          if [ "$EVENTO" = "pull_request" ] && [ "$AUTOR" != "dependabot[bot]" ]; then
            bash scripts/preflight.sh --pr "origin/$BASE_REF"
          else
            bash scripts/preflight.sh
          fi
      - name: Pruebas de la base (migraciones, rechazos de cada restricción y consultas de control Q01 a Q14)
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: bash db/pruebas/correr_pruebas.sh
      - name: uv 0.12.8 con Python 3.12
        # v10.3.0 (2026-10-09) y no una más nueva: una versión con menos de 14 días publicada espera,
        # igual que los paquetes de PyPI de uv.lock (pyproject.toml) y la espera de Dependabot.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.8"
          python-version: "3.12"
      - name: Dependencias de Python exactamente como las fija uv.lock
        run: uv sync --frozen
      - name: Pruebas de Python (esqueleto, exports inventados y lectura del Gherkin en español)
        # --frozen también aquí, para que uv run no vuelva a resolver ni toque uv.lock.
        run: uv run --frozen pytest -q

  # Secretos en todo el historial con gitleaks, fijado por versión y suma SHA-256. Hoy es un check
  # informativo; pasa a requerido cuando se confirme que no da falsos positivos (docs/devops.md).
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 sobre el historial
        run: |
          # --proto =https impide que una redirección lleve la descarga a HTTP (hallazgo de SonarQube Cloud).
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  # main solo recibe versiones (desde develop) o arreglos urgentes (hotfix/*).
  flujo:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Rama de origen permitida
        env:
          ORIGEN: ${{ github.head_ref }}
        run: |
          case "$ORIGEN" in
            develop|hotfix/*) echo "PR a main desde $ORIGEN: permitido" ;;
            *) echo "::error::Un PR a main solo puede salir de develop o de hotfix/*, no de $ORIGEN"; exit 1 ;;
          esac
