# Pruebas de cada cambio y control del flujo de ramas (docs/devops.md).
# Hoy «pruebas» corre la revisión previa (scripts/preflight.sh), las pruebas de la base
# (db/pruebas/) y pytest, que incluye la lectura del Gherkin en español de specs/ y los exports
# inventados. Los pasos de aceptación (T050) entran en ese mismo pytest, para que el check
# requerido por la protección de ramas siga llamándose igual.
# No usa acciones ni imágenes de Redgate mientras su licencia esté en revisión.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    # El reporte de pytest para el informe de la matriz de cumplimiento (US-90 de la spec 008), fuera del
    # repositorio. Va en el entorno del job para no cambiar el paso de las pruebas de Python.
    env:
      PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/../informes_ci/pytest.xml
    # PostgreSQL 18 desechable para las pruebas de la base (db/pruebas/), que aplican las
    # migraciones con psql, sin Flyway ni imágenes de Redgate. Vive solo lo que dura el job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prueba de la revisión previa y del hook de memoria (casos que deben pasar y que deben fallar)
        run: bash scripts/probar_preflight.sh
      - name: Revisión previa (datos inventados, secretos y memoria)
        # Los PR de Dependabot no escriben MEMORIA.md; se revisa el repositorio completo y la
        # actualización queda registrada en la memoria con el siguiente cambio (docs/devops.md).
        env:
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          AUTOR: ${{ github.actor }}
          # Huellas SHA-256 de los correos prohibidos (US-88 de la spec 008). Sin el secreto, el guion avisa y no falla.
          HUELLAS_CORREOS_PROHIBIDOS: ${{ secrets.HUELLAS_CORREOS_PROHIBIDOS }}
        run: |
          if [ "$EVENTO" = "pull_request" ] && [ "$AUTOR" != "dependabot[bot]" ]; then
            bash scripts/preflight.sh --pr "origin/$BASE_REF"
          else
            bash scripts/preflight.sh
          fi
      - name: Cliente de PostgreSQL 18, la versión de Neon (J-17)
        # El runner trae psql y pg_dump 16, y pg_dump no vuelca un servidor de una versión mayor más nueva.
        # El repositorio oficial de PostgreSQL (PGDG) da el cliente 18, que pasa al frente del PATH.
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version | grep -q " 18\."
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Pruebas de la base (migraciones, rechazos de cada restricción y consultas de control Q01 a Q14)
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: bash db/pruebas/correr_pruebas.sh
      - name: uv 0.12.8 con Python 3.12
        # v10.3.3 (2026-10-28), con más de 14 días publicada. Una versión más nueva espera esos 14 días,
        # igual que los paquetes de PyPI de uv.lock (pyproject.toml) y la espera de Dependabot.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.8"
          python-version: "3.12"
      - name: Dependencias de Python exactamente como las fija uv.lock
        # --no-build impide construir desde su código fuente cualquier dependencia de terceros, así que
        # ningún paquete de uv.lock corre código propio al instalarse. uv construye solo este proyecto, con
        # la construcción directa de uv_build, que no ejecuta Python (hallazgo githubactions:S8541 de
        # SonarQube Cloud).
        run: uv sync --frozen --no-build
      - name: Front de la misma rama para pytest y la matriz de cumplimiento (US-88 y US-90 de la spec 008)
        # El Front es público. La matriz busca los escenarios de pantalla y de navegador en la rama del mismo
        # nombre y, si no existe, en develop. La copia vive fuera del repositorio y se borra con el runner. Va antes
        # de pytest, que la recibe en ABET_FRONT_RAIZ para los escenarios de US-88 que nombran el Front y la
        # comparación de cumplimiento.md con el Front real. Por eso la rama del Front se empuja antes que la del Back.
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          FRONT=https://github.com/jeffangeloss/ABET-ULIMA-Front.git
          if ! git clone -q --depth 1 --branch "$RAMA" "$FRONT" ../front_ci 2>/dev/null; then
            git clone -q --depth 1 --branch develop "$FRONT" ../front_ci
          fi
          git -C ../front_ci log -1 --format='Front en %h'
      - name: Pruebas de Python (biblioteca abet_carga, bases desechables, exports inventados y Gherkin en español)
        # --frozen y --no-build también aquí, para que uv run no vuelva a resolver, no toque uv.lock y no
        # construya desde su código fuente ninguna dependencia. Las pruebas con el marcador base crean y
        # borran bases abet_demo_ en el mismo PostgreSQL 18 del paso de la base, con las mismas variables
        # de libpq y sin contraseña.
        env:
          PGHOST: localhost
          PGUSER: postgres
          ABET_FRONT_RAIZ: ${{ github.workspace }}/../front_ci
        run: uv run --frozen --no-build pytest -q
      - name: Node 24 para las pruebas del Front
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Pruebas de Vitest del Front con su reporte JSON, solo para el informe de la matriz
        # La CI del Front es la que exige que sus pruebas pasen. Aquí el reporte lleva el resultado y la fecha de
        # cada prueba al informe, y una prueba fallida sale como «Fallida» en él. --ignore-scripts como en el Front.
        # Vitest corre con el binario que deja npm ci en la versión del package-lock.json, sin bajar nada en el momento
        # (SonarCloud, githubactions:S6505 y S8543).
        working-directory: ../front_ci
        run: |
          npm ci --ignore-scripts
          npm run build
          ./node_modules/.bin/vitest run --reporter=json --outputFile=../informes_ci/vitest.json || echo "Vitest termina con fallas; el informe de la matriz las muestra."
      - name: Matriz de cumplimiento de las specs 007 y 008 (US-90 de la spec 008)
        # Falla ante un hueco o si cumplimiento.md no está al día, y deja el informe con el resultado y la fecha de
        # cada prueba en el resumen de la corrida, fuera del repositorio.
        run: |
          OPCIONES=(--front ../front_ci --informe "$GITHUB_STEP_SUMMARY")
          if [ -s ../informes_ci/vitest.json ]; then OPCIONES+=(--vitest ../informes_ci/vitest.json); fi
          if [ -s ../informes_ci/pytest.xml ]; then OPCIONES+=(--junit ../informes_ci/pytest.xml); fi
          uv run --frozen --no-build python scripts/matriz_cumplimiento.py --comprobar "${OPCIONES[@]}"

  # Secretos en todo el historial con gitleaks, fijado por versión y suma SHA-256. Hoy es un check
  # informativo; pasa a requerido cuando se confirme que no da falsos positivos (docs/devops.md).
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 sobre el historial
        run: |
          # --proto =https impide que una redirección lleve la descarga a HTTP (hallazgo de SonarQube Cloud).
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  # main solo recibe versiones (desde develop) o arreglos urgentes (hotfix/*).
  flujo:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Rama de origen permitida
        env:
          ORIGEN: ${{ github.head_ref }}
        run: |
          case "$ORIGEN" in
            develop|hotfix/*) echo "PR a main desde $ORIGEN: permitido" ;;
            *) echo "::error::Un PR a main solo puede salir de develop o de hotfix/*, no de $ORIGEN"; exit 1 ;;
          esac
