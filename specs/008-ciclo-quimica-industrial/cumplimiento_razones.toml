# Razones escritas de la matriz de cumplimiento de las specs 007 y 008 (US-90, T055).
#
# scripts/matriz_cumplimiento.py lee este archivo. Un escenario sin prueba hace fallar la generación salvo que este
# archivo dé su razón. Hay dos clases de entradas.
# - [historias.US-NN] marca una historia entera como «Pendiente por decisión» o «Pendiente de tarea», con su razón.
# - [[escenarios]] marca un escenario. Con «pruebas», lo enlaza con las pruebas del Front que lo comprueban aunque su
#   título no sea el del escenario, y con «estado», lo deja pendiente.
# Cada entrada lleva su razón. Las rutas de «archivo» son relativas a specs/ en los escenarios y al Front en las pruebas.
# Una razón que nombra una historia o un escenario que no existe hace fallar la generación, y una razón de pendiente
# cuyo escenario ya tiene prueba sale como aviso, para quitarla.

[historias.US-66]
estado = "Pendiente por decisión"
razon = "Espera a D-47 y a D-51 de la spec 007 (FR-001 de la spec 008)."

[historias.US-80]
estado = "Pendiente por decisión"
razon = "Sustituida el 2026-11-25 por la spec 009 (J-61). El agregado del curso sale de la ruta 20 y de P8, no de la ruta 12 ni de P6, así que T039 y T047 no se construyen."

# Los seis escenarios de US-80, sustituidos el 2026-11-25 por la spec 009 (J-61). Cada uno nombra los de la spec 009
# que cubren lo mismo con la ruta 20 y P8.

