# CI propuesto para la base de datos (todavía sin probar en GitHub).
# Levanta PostgreSQL 16 como servicio, aplica las migraciones con Flyway Community
# (info, migrate, validate) y luego corre las pruebas sin Flyway sobre bases desechables.
name: bd

permissions:
  contents: read

on:
  pull_request:
    paths: ["db/**", "pruebas/**", "herramientas/**", "referencia/**", "flyway.toml", ".github/workflows/bd.yml"]
  push:
    branches: [main]

jobs:
  migraciones:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: abet_sis_med_dev
          # Servicio desechable del job: autenticación trust, sin contraseña escrita.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Credenciales del servicio desechable del job (trust, sin contraseña). Para una base compartida
    # van en secrets o vars del repositorio, nunca escritas aquí.
    env:
      ABET_DB_USER: postgres
      ABET_DB_PASSWORD: ""
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Flyway (edición community)
        uses: red-gate/setup-flyway@v3
        with:
          # Versión fija para que el CI no cambie de Flyway sin una revisión.
          version: 13.10.3
          edition: community
          i-agree-to-the-eula: true

      - name: flyway info
        run: flyway info

      - name: flyway migrate
        run: flyway migrate

      - name: flyway validate
        run: flyway validate

      # Las pruebas usan psql y pg_dump del runner; se exige la versión 16 o posterior para volcar un servidor 16.
      - name: Verificar psql y pg_dump 16 o posterior
        run: |
          psql --version
          pg_dump --version
          pg_dump --version | grep -Eq ' (1[6-9]|[2-9][0-9])\.'

      - name: Pruebas (generador, dos bases, pg_dump, datos sintéticos y aserciones)
        run: ./pruebas/correr_pruebas.sh
