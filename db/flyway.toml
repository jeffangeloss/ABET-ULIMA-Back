# Configuración de Flyway para ABET_SIS_MED (PostgreSQL 18).
# Las credenciales nunca van escritas en este archivo ni en ningún otro del repositorio.
# Se leen de variables de entorno, ABET_DB_USER y ABET_DB_PASSWORD para la base local
# y NEON_HOST, NEON_DB, NEON_DB_USER y NEON_DB_PASSWORD para la base en Neon.
# Los ajustes personales van en flyway.user.toml, que .gitignore excluye.

[flyway]
# callbacks guarda afterMigrate__permisos_lectura.sql, que repone después de cada migrate los permisos de los
# roles de lectura, del respaldo y de la aplicación. No es una migración, así que no entra en flyway_schema_history.
locations = ["filesystem:migration", "filesystem:callbacks"]
createSchemas = true
validateMigrationNaming = true
cleanDisabled = true
outOfOrder = false
environment = "dev"

# En el formato TOML, schemas es un ajuste del entorno, no de [flyway]. abet va primero porque guarda
# flyway_schema_history. Con createSchemas = true, Flyway crea en cada migrate el esquema de la lista que
# falte, aunque el historial ya exista, y lo anota como << Flyway Schema Creation >>. El CREATE SCHEMA IF NOT
# EXISTS de V1_09__crear_acceso.sql queda para los caminos con psql y para un entorno que no liste acceso.
[environments.dev]
url = "jdbc:postgresql://localhost:5432/abet_sis_med_dev"
schemas = ["abet", "acceso"]
user = "${env.ABET_DB_USER}"
password = "${env.ABET_DB_PASSWORD}"

# dev es el entorno por defecto, así que toda ejecución sin -environment corre contra la base local con clean
# permitido. Flyway corre en la Mac y en Neon (T027), y la CI aplica las migraciones con psql, sin Flyway. Un
# entorno compartido, como el de Neon, se agrega con su propio bloque y sin este override.
[environments.dev.flyway]
cleanDisabled = false

# Base compartida en Neon, el proyecto ABET-ULIMA (PostgreSQL 18, región us-east-1, J-17). Se llama siempre con
# -environment=neon.
# NEON_HOST es el host de la conexión directa, sin "-pooler" (por ejemplo ep-xxxx.us-east-1.aws.neon.tech),
# porque Flyway toma bloqueos de asesoría y el repartidor de conexiones de Neon trabaja en modo transacción.
# sslmode=verify-full cifra la conexión y comprueba que el certificado sea del host; DefaultJavaSSLFactory
# valida ese certificado con los certificados raíz de Java, porque en un runner no existe ~/.postgresql/root.crt.
# Sin override de cleanDisabled, este entorno hereda cleanDisabled = true de [flyway] y clean queda prohibido.
[environments.neon]
url = "jdbc:postgresql://${env.NEON_HOST}/${env.NEON_DB}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory"
schemas = ["abet", "acceso"]
user = "${env.NEON_DB_USER}"
password = "${env.NEON_DB_PASSWORD}"
